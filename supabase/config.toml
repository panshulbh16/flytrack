# Supabase CLI config (only the parts we change; `supabase init` defaults apply otherwise).
project_id = "flytrack"

[auth]
enabled = true
site_url = "http://localhost:3000"
# low-friction start: anonymous session, link Google/phone later
enable_anonymous_sign_ins = true

[auth.external.google]
enabled = false # turn on in Step 3 with Android OAuth client id
client_id = "env(GOOGLE_WEB_CLIENT_ID)"
secret = "env(GOOGLE_WEB_CLIENT_SECRET)"
skip_nonce_check = true

[functions.search-flight]
verify_jwt = true

[functions.poll-flights]
verify_jwt = false # protected by x-cron-secret instead (called from pg_cron)

[functions.refresh-airport-weather]
verify_jwt = false # protected by x-cron-secret (called from pg_cron every 15 min); fetches aviationweather.gov METARs

[functions.provider-webhook]
verify_jwt = false # protected by ?token= secret (called by AeroDataBox)

[functions.send-test-push]
verify_jwt = true

[functions.parse-ticket]
verify_jwt = true
# Secret ANTHROPIC_API_KEY (supabase secrets set, or supabase/functions/.env). Never log ticket text.

[functions.revenuecat-webhook]
verify_jwt = false # protected by the Authorization secret REVENUECAT_WEBHOOK_AUTH (called by RevenueCat)

[functions.sync-entitlement]
verify_jwt = true

[functions.ack-push]
verify_jwt = true # delivery receipts: the caller's own push_log rows only

[functions.shared-flight]
verify_jwt = false # public share link: the unguessable ?t= token is the only key; returns public fields only

[functions.inbound-email]
verify_jwt = false # protected by the x-inbound-secret header (secret INBOUND_EMAIL_SECRET), called by the mail provider's adapter; never stores the email

[functions.calendar-feed]
verify_jwt = false # calendar apps can't send a JWT: the unguessable ?t= token (profiles.calendar_token) is the only key

[functions.search-route]
verify_jwt = true # P3 B5: search by route / airport; 2 units of the caller's daily search quota per provider fetch

[functions.airport-status]
verify_jwt = false # P3 B8: public airport page data (web/airports); counts and weather only, never user data

[functions.global-report]
verify_jwt = false # P3 B11: public yearly report (web/report); anonymous aggregates with k-anonymity

# ---------- P4 (docs/P4_CONTRACTS.md) ----------
[functions.radar]
verify_jwt = true # P4 section 1: Pro only; RADAR_FEED (none|opensky|adsbx) + RADAR_FEED_LICENSED=true; 60 req / 10 min

[functions.tripit-connect]
verify_jwt = true # P4 section 2: Pro; returns the TripIt authorize_url (TRIPIT_CONSUMER_KEY / TRIPIT_CONSUMER_SECRET)

[functions.tripit-callback]
verify_jwt = false # TripIt redirects the browser here. Never exchanges: issues a one-time code for the app (migration 35)

[functions.tripit-complete]
verify_jwt = true # redeems the callback code; exchanges only for the user who started tripit-connect (login CSRF fix)

[functions.tripit-sync]
verify_jwt = false # checked in the function: user JWT ("Sync now", Pro) or x-cron-secret (hourly pg_cron)

[functions.tripit-disconnect]
verify_jwt = true # deletes the caller's connection; allowed without Pro
