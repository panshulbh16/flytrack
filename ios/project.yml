name: FlyTrack
options:
  bundleIdPrefix: app.heygate
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  xcodeVersion: "27.2"
  projectFormat: xcode27_0
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    SWIFT_EMIT_LOC_STRINGS: YES
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  FlyTrackCore:
    path: FlyTrackCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.7
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.2.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.1.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.102.3
targets:
  FlyTrack:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FlyTrack
        excludes:
          - FlyTrack.entitlements
          - Info.plist
          - Resources/TerminalMaps
          - Resources/TerminalMaps/**
      # P4 §4: bundled OSM terminal maps as a folder reference, so they load with
      # Bundle.main.url(forResource: "DEL", withExtension: "geojson", subdirectory: "TerminalMaps").
      - path: FlyTrack/Resources/TerminalMaps
        type: folder
        buildPhase: resources
        optional: true
      - path: FlightActivity/FlightActivityAttributes.swift
    dependencies:
      - package: FlyTrackCore
        product: FlyTrackCore
      - package: Supabase
        product: Supabase
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: RevenueCat
        product: RevenueCat
      - target: ShareExtension
        embed: true
      - target: FlightActivity
        embed: true
      - target: FlyTrackWidget
        embed: true
      # P3 B9: the Apple Watch app, embedded in the iPhone app's Watch folder.
      - target: FlyTrackWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLYTRACK_BUNDLE_ID)
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HeyGate
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: FlyTrack/FlyTrack.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: FlyTrack/Info.plist
      properties:
        CFBundleDisplayName: HeyGate
        # English and Hindi. Strings: Localizable.xcstrings; Info.plist text: FlyTrack/{en,hi}.lproj/InfoPlist.strings.
        CFBundleLocalizations:
          - en
          - hi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: HeyGate reads the barcode on your boarding pass to add the flight.
        # P3 A3: asked only when the user taps "Scan my calendar"; read-only.
        NSCalendarsFullAccessUsageDescription: HeyGate looks through your calendar for flights so you can add them in one tap. Nothing is uploaded or changed.
        # P4 section 1: "Planes near me" asks only on tap; approximate (reduced accuracy) location is enough.
        NSLocationWhenInUseUsageDescription: HeyGate uses your approximate location only while the radar screen is open, to show the planes near you. It is never stored.
        NSLocationDefaultAccuracyReduced: true
        UIBackgroundModes:
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - app.heygate.gmail-check
        NSSupportsLiveActivities: true
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - DMSans.ttf
          - DMSans-Italic.ttf
        CFBundleURLTypes:
          - CFBundleURLName: app.heygate.flytrack
            CFBundleURLSchemes:
              - heygate
          - CFBundleURLName: google-sign-in
            CFBundleURLSchemes:
              - $(REVERSED_GOOGLE_CLIENT_ID)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        GoogleIOSClientID: $(GOOGLE_IOS_CLIENT_ID)
        GoogleWebClientID: $(GOOGLE_WEB_CLIENT_ID)
        GmailImportEnabled: $(GMAIL_IMPORT_ENABLED)
        RevenueCatAPIKey: $(REVENUECAT_IOS_KEY)
        ShareBaseURL: $(SHARE_BASE_URL)
        LSApplicationQueriesSchemes:
          - whatsapp
        UILaunchScreen:
          UIColorName: LaunchBackground
    entitlements:
      path: FlyTrack/FlyTrack.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.app.heygate.flytrack
          # P3 A4: the widget snapshot (WidgetContract.appGroup), shared with FlyTrackWidget.
          - group.app.flytrack
  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShareExtension
        excludes:
          - Share.entitlements
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLYTRACK_BUNDLE_ID).share
        PRODUCT_MODULE_NAME: ShareExtension
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ShareExtension/Share.entitlements
        SKIP_INSTALL: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: HeyGate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareExtension.ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 4
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/Share.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.heygate.flytrack
  FlightActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FlightActivity
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLYTRACK_BUNDLE_ID).activity
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: FlightActivity/Info.plist
      properties:
        CFBundleDisplayName: HeyGate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # P3 A4: Home Screen (small, medium) and Lock Screen (rectangular, inline) widgets. Reads the snapshot the app
  # writes into the App Group group.app.flytrack; no network. Theme.swift and the fonts are shared with the app.
  FlyTrackWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FlyTrackWidget
        excludes:
          - Info.plist
          - FlyTrackWidget.entitlements
      - path: FlyTrack/Theme.swift
      - path: FlyTrack/Fonts
        buildPhase: resources
        excludes:
          - "*.txt"
    dependencies:
      - package: FlyTrackCore
        product: FlyTrackCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLYTRACK_BUNDLE_ID).widget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: FlyTrackWidget/FlyTrackWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: FlyTrackWidget/Info.plist
      properties:
        CFBundleDisplayName: HeyGate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - en
          - hi
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - DMSans.ttf
          - DMSans-Italic.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FlyTrackWidget/FlyTrackWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.flytrack
  # P3 B9: Apple Watch app (next flight over WatchConnectivity) and its WidgetKit complication.
  FlyTrackWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: FlyTrackWatch
        excludes:
          - Info.plist
          - FlyTrackWatch.entitlements
    dependencies:
      - package: FlyTrackCore
        product: FlyTrackCore
      - target: FlyTrackWatchComplication
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLYTRACK_BUNDLE_ID).watchkitapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HeyGate
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(FLYTRACK_BUNDLE_ID)
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        CODE_SIGN_ENTITLEMENTS: FlyTrackWatch/FlyTrackWatch.entitlements
        SKIP_INSTALL: YES
    info:
      path: FlyTrackWatch/Info.plist
      properties:
        CFBundleDisplayName: HeyGate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - en
          - hi
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(FLYTRACK_BUNDLE_ID)
    entitlements:
      path: FlyTrackWatch/FlyTrackWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.flytrack
  FlyTrackWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: FlyTrackWatchComplication
        excludes:
          - Info.plist
          - FlyTrackWatchComplication.entitlements
      - path: FlyTrackWatch/WatchWording.swift
    dependencies:
      - package: FlyTrackCore
        product: FlyTrackCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLYTRACK_BUNDLE_ID).watchkitapp.complication
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: FlyTrackWatchComplication/FlyTrackWatchComplication.entitlements
        SKIP_INSTALL: YES
    info:
      path: FlyTrackWatchComplication/Info.plist
      properties:
        CFBundleDisplayName: HeyGate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - en
          - hi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FlyTrackWatchComplication/FlyTrackWatchComplication.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.flytrack
schemes:
  FlyTrack:
    build:
      targets:
        FlyTrack: all
        ShareExtension: all
        FlightActivity: all
        FlyTrackWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: FlyTrackCore/FlyTrackCoreTests
    archive:
      config: Release
  # P3 B9: run the watch app on a paired watch simulator.
  FlyTrackWatch:
    build:
      targets:
        FlyTrackWatch: all
        FlyTrackWatchComplication: all
    run:
      config: Debug
    archive:
      config: Release
