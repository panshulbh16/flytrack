<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Airport delays today · HeyGate</title>
  <meta name="description" content="Is the airport running on time? Live departure delays, fog and cancellations for today.">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f6f5ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14281f" media="(prefers-color-scheme: dark)">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co http://127.0.0.1:54321 http://localhost:54321; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="../share/share.css">
  <link rel="stylesheet" href="public.css">
</head>
<body>
  <main class="page" aria-live="polite">
    <header class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span>HeyGate</span>
      <span class="brand-note">airport status</span>
    </header>
    <p class="crumbs"><a href="./">All airports</a></p>

    <section id="state-loading" class="notice">
      <p class="serif">Checking the airport…</p>
    </section>

    <section id="state-error" class="notice" hidden>
      <h1 class="serif" id="error-title">Which airport?</h1>
      <p id="error-body">Pick one from the list.</p>
    </section>

    <article id="airport" hidden>
      <div class="headline">
        <h1 class="serif" id="title"></h1>
        <p class="route" id="name"></p>
        <p class="status" id="level" data-tone="ok"></p>
        <p class="lede" id="headline"></p>
      </div>

      <div class="globe-wrap">
        <canvas id="globe" role="img" aria-label="Where the airport is"></canvas>
      </div>

      <section class="panel" aria-labelledby="today-title">
        <h2 id="today-title">Today</h2>
        <p class="note" id="weather"></p>
        <dl class="tiles" id="today"></dl>
      </section>

      <p class="meta" id="meta"></p>
    </article>

    <footer class="foot">
      Levels come from live weather reports and the departures HeyGate follows. Not an official airport source.
      Track your own flight with HeyGate for gate, delay and belt alerts.
    </footer>
  </main>

  <script src="../share/config.js"></script>
  <script src="../share/vendor/d3-array@3.2.4.min.js"></script>
  <script src="../share/vendor/d3-geo@3.1.1.min.js"></script>
  <script src="../share/vendor/topojson-client@3.1.0.min.js"></script>
  <script type="module" src="airports.js"></script>
</body>
</html>
